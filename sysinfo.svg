    <text x="140" y="699" class="font-mono" font-size="13" fill="#c9d1d9">: <tspan fill="#58a6ff">MongoDB • PostgreSQL • Redis</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="4.2s" fill="freeze"/>
