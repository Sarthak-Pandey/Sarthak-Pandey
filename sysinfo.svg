<svg xmlns="http://www.w3.org/2000/svg" width="840" height="760" viewBox="0 0 840 760">

  <style>
    .font-mono { font-family: 'Fira Code', 'Courier New', Consolas, monospace; }
    .cursor { animation: blink 1s infinite; fill: #58a6ff; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>

  <rect width="100%" height="100%" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <circle cx="25" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="45" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="65" cy="22" r="6" fill="#27c93f"/>
  <text x="90" y="27" class="font-mono" font-size="14" fill="#8b949e">Sarthak-Pandey@ai-terminal:~$ living-terminal --init</text>
  <line x1="0" y1="42" x2="840" y2="42" stroke="#30363d" stroke-width="1"/>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.1s" fill="freeze"/>
