<svg xmlns="http://www.w3.org/2000/svg" width="860" height="840" viewBox="0 0 860 840">
  <defs>
    <!-- Glow filter for neon text -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Strong glow for banner -->
    <filter id="glowStrong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Accent gradient for section headers -->
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d2a8ff"/>
      <stop offset="50%" stop-color="#f778ba"/>
      <stop offset="100%" stop-color="#ffa657"/>
    </linearGradient>
    <!-- Gradient for the top bar -->
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <!-- Scanline overlay -->
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="4" height="4">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#e6edf3" stroke-opacity="0.015" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace; }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes slideIn { from { transform: translateX(-12px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeUp { from { transform: translateY(6px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
    @keyframes scanPulse { 0%,100% { opacity: 0.02; } 50% { opacity: 0.05; } }
    @keyframes borderGlow {
      0%,100% { stroke: #30363d; stroke-opacity: 0.5; }
      50% { stroke: #58a6ff; stroke-opacity: 0.25; }
    }
  </style>
  <rect width="100%" height="100%" rx="14" fill="#0d1117"/>
  <rect width="100%" height="100%" rx="14" fill="none" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.12" style="animation: borderGlow 6s ease-in-out infinite;"/>
  <rect width="100%" height="100%" rx="14" fill="url(#scanlines)" style="animation: scanPulse 4s ease-in-out infinite;"/>
  <rect x="0" y="0" width="860" height="44" rx="14" fill="url(#barGrad)"/>
  <rect x="0" y="30" width="860" height="14" fill="url(#barGrad)"/>
