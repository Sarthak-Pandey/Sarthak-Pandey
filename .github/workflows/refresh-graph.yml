name: Refresh Living Terminal Profile

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx lxml pillow pyyaml pytest

      - name: Run Unit Tests
        run: |
          pytest -v

      - name: Generate Living Terminal Assets
        run: |
          python tools/generate_profile.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Readme.md sysinfo.svg graph.svg portrait.svg assets/contributions.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update living terminal profile [skip ci]" && git push)
